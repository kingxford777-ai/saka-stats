<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bukayo Saka Stats Tracker</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main class="app">
        <header class="header">
            <h1>Bukayo Saka</h1>
            <p class="subtitle">Career Stats Tracker</p>
        </header>

        <section class="stats-grid">

          <!-- Combined Totals Card -->
            <article class="stat-card combined">
                <h2>All Time</h2>
                <p>Appearances: <span id="combined-appearances">0</span></p>
                <p>Goals: <span id="combined-goals">0</span></p>
                <p>Assists: <span id="combined-assists">0</span></p>
                <p>Trophies: <span id="combined-trophies">0</span></p>
                <p>Awards: <span id="combined-awards">0</span></p>
              
            </article>

          
            <!-- Arsenal Card -->
            <article class="stat-card">
                <h2>Arsenal</h2>
                <p>Appearances: <span id="club-appearances">0</span></p>
                <p>Goals: <span id="club-goals">0</span></p>
                <p>Assists: <span id="club-assists">0</span></p>
                <p>Trophies: <span id="club-trophies">0</span></p>
                <p>Awards: <span id="club-awards">0</span></p>
            </article>

            <!-- England Card -->
            <article class="stat-card">
                <h2>England</h2>
                <p>Appearances: <span id="international-appearances">0</span></p>
                <p>Goals: <span id="international-goals">0</span></p>
                <p>Assists: <span id="international-assists">0</span></p>
                <p>Trophies: <span id="international-trophies">0</span></p>
                <p>Awards: <span id="international-awards">0</span></p>
            </article>

            
        </section>

        <footer>
            <p id="last-updated"></p>
            <p id="source"></p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
